x-airflow-common: &airflow-common
    build: ./airflow
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./dbt_projects:/opt/airflow/dbt_projects
    depends_on:
        postgres:
            condition: service_healthy
    environment:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
        AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
        AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
        AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
        AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
        AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

services:
    postgres:
        image: postgres:15
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - ./db:/docker-entrypoint-initdb.d
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
    backend:
        build: ./backend
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: ${DATABASE_URL}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_HOST: ${POSTGRES_HOST}
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
    airflow-init:
        <<: *airflow-common
        command: bash -c "airflow db migrate && airflow users create --role Admin --username ${AIRFLOW_ADMIN_USERNAME} --password ${AIRFLOW_ADMIN_PASSWORD} --email ${AIRFLOW_ADMIN_EMAIL} --firstname Admin --lastname User"
        restart: on-failure
    airflow-webserver:
        <<: *airflow-common
        command: webserver
        ports:
            - "8080:8080"
        depends_on:
            airflow-init:
                condition: service_completed_successfully
    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        depends_on:
            airflow-init:
                condition: service_completed_successfully   
volumes:
    postgres_data: