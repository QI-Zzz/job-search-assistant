name: job_search_assistant
version: '1.0.0'
profile: job_search_assistant

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Free, rule-based filters applied before any LLM call (see jobs_prefiltered).
# Patterns are case-insensitive Postgres regexes; \m and \M are word boundaries.
vars:
  prefilter:
    lead_title: '\m(lead|leader|head|manager|managing|principal|director|chief|vp|vice president|supervisor|teamlead|teamleider)\M'
    senior_title: '\m(senior|sr|staff)\M'
    # also Dutch thesis / research internships and graduate programmes named by year ("SDE - 2027")
    junior_track_title: '\m(intern|internship|stage|stagiair|werkstudent|trainee|graduate|afstudeer\w*|onderzoeksstage|20[2-3][0-9])\M'
    # university teaching and research roles; pass 1 labelled a lecturer and a postdoc as data / ML
    academic_title: '\m(phd|postdoc|postdoctoral|lecturer|professor|docent|hoogleraar)\M'
    freelance_title: '\m(freelance|freelancer|zzp|interim)\M'
    # not "freelancers" (agency boilerplate: "we support freelancers and employees"); no leading word
    # boundary, because scraped descriptions often run words together ("anywhereFreelance autonomy")
    freelance_description: '(freelance|\mzzp)\M'
    # also agency traineeship programmes listed as several jobs ("Business Analyst | Talent Program")
    pool_title: '(talent pool|candidate pool|talent program|open application|open sollicitatie)'
    # companies Amy does not want to work for: Coolblue, bol, MediaMarkt and the Big Four (Deloitte, PwC, EY, KPMG)
    excluded_company: '(cool ?blue|\mbol\M|media ?markt|deloitte|pwc|pricewaterhouse|\mey\M|ernst (&|and) young|kpmg)'
    # titles asking for another language; Mandarin / Chinese are left out on purpose (Amy is a native speaker)
    # "German-speaking", "Dutch speaker", "(French)", or a language at the end ("Sales Trader - Polish")
    other_language_title: '(\m(dutch|flemish|german|french|spanish|italian|portuguese|polish|czech|hungarian|swedish|danish|norwegian|finnish|nordic|turkish|arabic|russian|japanese|korean)[- ]speak(ing|ers?)\M|\((dutch|flemish|german|french|spanish|italian|portuguese|polish|czech|hungarian|swedish|danish|norwegian|finnish|nordic|turkish|arabic|russian|japanese|korean)\)|[-–] (dutch|flemish|german|french|spanish|italian|portuguese|polish|czech|hungarian|swedish|danish|norwegian|finnish|nordic|turkish|arabic|russian|japanese|korean)$)'
    # LinkedIn's own fields; "Mid-Senior level" is not used because most jobs say "Not Applicable"
    excluded_experience_levels: ['Director', 'Executive', 'Internship']
    # "Contract" and "Temporary" are mostly freelance / day-rate agency work; fixed-term employee jobs are "Full-time" and are kept
    excluded_contract_types: ['Internship', 'Volunteer', 'Part-time', 'Contract', 'Temporary']
    # Amsterdam region plus Utrecht (city and province) and the Randstad; country-only or remote locations are kept
    allowed_location: '(amsterdam|amstelveen|hoofddorp|schiphol|utrecht|randstad|^netherlands$|remote)'
  # Rules applied to pass 1 facts (see jobs_eligibility).
  eligibility:
    max_years_required: 5
    # pass 1 role families that go on to scoring; every other family is dropped
    # software_engineering dropped 2026-10-30: Amy's CV and experience don't fit software roles
    # presales_solutions dropped 2026-10-30: Amy's review found few presales jobs she would apply to
    keep_role_families: ['data_analytics', 'data_ml_ai_engineering', 'business_analysis_consulting']
  # Weights for pass 2 sub-scores and the rules for picking jobs for the email (see job_ranking).
  ranking:
    # only jobs first fetched in the last N days are listed; keep in step with SCORE_RECENT_DAYS in config.py
    recent_days: 2
    career_weights:
      salary_ceiling: 0.30
      geographic_mobility: 0.25
      skill_transferability: 0.25
      low_lock_in_risk: 0.20

models:
  job_search_assistant:
    staging:
      +schema: staging
      +materialized: view
    mart:
      +schema: mart
      +materialized: table
