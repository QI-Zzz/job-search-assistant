version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: jobs
        description: "Raw job postings data from the source system."
        columns:
          - name: job_id
            description: "Unique identifier for each job posting."
          - name: title
            description: "Title of the job posting."
          - name: company
            description: "Company offering the job."
          - name: location
            description: "Location of the job."
          - name: description
            description: "Full text description of the job posting."
          - name: linkedin_url
            description: "URL to the job posting on LinkedIn."
          - name: source
            description: "Source from which the job posting was collected."
          - name: collected_at
            description: "Timestamp when the job posting was collected."
